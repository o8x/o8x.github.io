name: Build and deploy

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: macos-15
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install latest camus
                run: |
                    curl -fsSL https://raw.githubusercontent.com/the-writer/camus/main/scripts/install.sh | bash
                    camus -v

            -   name: Install fonts
                run: |
                    brew install --cask \
                        font-noto-sans \
                        font-noto-serif \
                        font-noto-sans-cjk-sc \
                        font-noto-serif-cjk-sc

            -   name: Ensure Chrome
                run: |
                    chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
                    if [ ! -x "$chrome" ]; then
                        brew install --cask google-chrome
                    fi
                    test -x "$chrome"

            -   name: Setup Pages
                id: pages
                if: github.event_name == 'push'
                uses: actions/configure-pages@v5

            -   name: Build site
                env:
                    CAMUS_AUTO_CHECK_UPDATE: "false"
                    CAMUS_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
                run: |
                    camus --build
                    test -s dist/pdf/index.pdf

            -   name: Create release
                if: github.event_name == 'push'
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    tag="build-$(date -u +%Y%m%d-%H%M%S)"
                    gh release create "$tag" dist/pdf/index.pdf \
                        --title "$tag" \
                        --notes "Automated build of ${{ github.sha }}"

            -   name: Upload Pages artifact
                if: github.event_name == 'push'
                uses: actions/upload-pages-artifact@v3
                with:
                    path: dist/html

    deploy:
        if: github.event_name == 'push'
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@v5
